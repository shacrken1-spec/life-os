  <a href="#focus" data-route="focus" class="sheet-link">Focus</a>

<script src="auth.js"></script>
<script src="modules/dashboard.js"></script>
<script src="modules/trading.js"></script>
<script src="modules/workout.js"></script>
<script src="modules/habits.js"></script>
<script src="modules/supplements.js"></script>
<script src="modules/watchlist.js"></script>
<script src="modules/goals.js"></script>
<script src="modules/content.js"></script>
<script src="modules/braindump.js"></script>
<script src="modules/focus.js"></script>
<script>
const Routes = {
  dashboard: Dashboard, trading: Trading, workout: Workout, habits: Habits,
  supplements: Supplements, watchlist: Watchlist, goals: Goals,
  content: Content, braindump: Braindump, focus: Focus
};
const view = document.getElementById('view');
let currentRoute = null;

async function navigate() {
  const route = location.hash.replace('#', '') || 'dashboard';
  const mod = Routes[route] || Routes.dashboard;
  if (currentRoute === route) return;
  currentRoute = route;
  document.querySelectorAll('[data-route]').forEach(a =>
    a.classList.toggle('active', a.dataset.route === route));
  closeSheet();
  view.classList.add('leaving');
  await new Promise(r => setTimeout(r, 200));
  view.innerHTML = '';
  view.classList.remove('leaving');
  await mod.render(view);
}
window.addEventListener('hashchange', navigate);

const sheet = document.getElementById('more-sheet');
function closeSheet() { sheet.hidden = true; }
document.getElementById('more-btn').addEventListener('click', () => { sheet.hidden = !sheet.hidden; });
document.addEventListener('click', e => {
  if (!sheet.hidden && !sheet.contains(e.target) && e.target.id !== 'more-btn' && !document.getElementById('more-btn').contains(e.target)) closeSheet();
});

function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  document.querySelector('meta[name=theme-color]').content = t === 'dark' ? '#0f0f0f' : '#fafafa';
}
function toggleTheme() {
  applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
}
document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
document.getElementById('theme-toggle-m').addEventListener('click', toggleTheme);

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.hidden = true; }, 3000);
}

document.getElementById('auth-btn').addEventListener('click', () => Auth.toggle());
document.getElementById('auth-btn-m').addEventListener('click', () => Auth.toggle());
Auth.onChange(signedIn => {
  if (signedIn) Store.load('settings');
  const label = signedIn ? 'Sign out' : 'Sign in';
  document.getElementById('auth-btn').textContent = label;
  document.getElementById('auth-btn-m').textContent = label;
  if (signedIn && currentRoute) { const r = currentRoute; currentRoute = null; location.hash = '#' + r; navigate(); }
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
navigate();
</script>
